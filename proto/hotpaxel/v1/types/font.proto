syntax = "proto3";

package hotpaxel.v1;
option go_package = "hotpaxel/v1";

import "hotpaxel/v1/types/asset.proto";
import "hotpaxel/v1/types/system.proto";

message FontInfo {
  string family = 1;
  repeated string styles = 2;
  string file_name = 3;
}

message FontListResponse {
  repeated FontInfo fonts = 1;
}

message DownloadFontRequest {
  string file_name = 1;
}

message FontChunk {
  bytes data = 1;
}

message ValidateFontRequest {
  Asset font = 1;
}

message ValidateFontResponse {
  bool is_valid = 1;
  optional string family_name = 2;
  optional string error_message = 3;
}
