<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | HOTPAXEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5c6bc0;
            --primary-dark: #3949ab;
            --bg: #0f172a;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            z-index: 10;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 0.8;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 2rem;
            color: var(--text);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 99px;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 10px 15px -3px rgba(92, 107, 192, 0.4);
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(92, 107, 192, 0.5);
        }

        /* Decorative blobs */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(92, 107, 192, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
        }

        .blob-1 {
            top: -200px;
            left: -200px;
        }

        .blob-2 {
            bottom: -200px;
            right: -200px;
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <h1>404</h1>
        <h2>페이지를 찾을 수 없습니다</h2>
        <p>요청하신 페이지가 존재하지 않거나, 다른 주소로 옮겨졌을 수 있습니다.<br>아래 버튼을 클릭하여 메인 에디터로 돌아가실 수 있습니다.</p>
        <a href="/" class="btn">메인으로 돌아가기</a>
    </div>
</body>

</html>
