services:
  hotpaxel:
    image: hotpaxel/hotpaxel:0.2.1-alpha.2
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888" # Unified Port (API + UI)
    environment:
      - PORT=8888
      - STATIC_DIR=./public
      - DOCS_DIR=./docs
      - DISABLE_UI=false
      - HOTPAXEL_AUTH_TOKEN=${HOTPAXEL_AUTH_TOKEN:-demo-secret-token}
    volumes:
      - ./apps/hot-editor/dist:/app/public:ro
      - ./apps/docs:/app/docs:ro
      # Uncomment if you have local binary and want to skip re-build cycles
      # - ./target/release/paxel:/app/paxel:ro
    restart: always
